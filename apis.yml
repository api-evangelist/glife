aid: glife
name: Glife
description: Glife Technologies Pte Ltd is a Singapore-based food-tech company on a
  mission to grow a better food future across Southeast Asia. Glife operates a farm-to-table
  commerce and supply-chain platform that connects farmers and suppliers with restaurants,
  retailers, and consumers — spanning sourcing, pricing, ordering, inventory, warehousing,
  and delivery. Its web and mobile applications are backed by a GraphQL API (api-sg.glifeware.com)
  exposing commerce, content, and supply-chain operations. Glife is backed by 500 Global.
